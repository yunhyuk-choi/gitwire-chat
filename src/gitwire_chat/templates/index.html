<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>gitwire-chat</title>
<!-- ⭐ 정적 자원 URL 에는 **내용 도장**이 박혀 있다 (`/assets/<도장>/…`).
     파일이 바뀌면 도장이 바뀌어 URL 이 달라지므로 브라우저가 알아서 새로 받는다 —
     갱신 후 강력 새로고침을 사람이 기억해야 하는 절차가 사라진다. 도장은 정적
     트리의 **내용 해시**라 같은 버전 문자열로 재배포해도 동작한다
     (`gitwire_chat/assets.py` 도크). `url_for('static', …)` 를 쓰면 도장이
     빠지므로 여기서는 `asset()` 만 쓴다 — 그 규율은 tests/test_assets.py 가 본다. -->
<link rel="stylesheet" href="{{ asset('style.css') }}">

<!-- ⭐ 고른 색 테마를 **첫 페인트 전에** 심는다. 모듈 스크립트는 HTML 파싱이
     끝난 뒤에 돌아서, 여기서 심지 않으면 어두운 테마를 쓰는 사람이 새로고침마다
     흰 화면 번쩍임을 본다.

     ⚠️ 여기 있는 것은 그 한 가지뿐이다 — 검증·저장·UI·전환은 전부
     `static/js/theme.js` 가 소유한다. 이 조각이 그 모듈과 같은 키·같은 속성을
     쓰는지는 `tests/test_theme.py` 가 기계로 확인한다(두 곳이 어긋나면
     "새로고침하면 테마가 풀린다"는 사고가 된다). -->
<script>
  try {
    var saved = localStorage.getItem('gitwire-chat.theme');
    if (saved && saved !== 'default') {
      document.documentElement.setAttribute('data-chat-theme', saved);
    }
    var box = localStorage.getItem('gitwire-chat.layout');
    if (box && box !== 'bubbles') {
      document.documentElement.setAttribute('data-chat-layout', box);
    }
  } catch (e) { /* 저장소를 못 읽는 환경 — 기본 테마로 뜨면 된다 */ }
</script>
</head>
<body data-view="rooms" data-default-author="{{ default_author }}" data-recent-limit="{{ recent_limit }}">

<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <h1 class="brand">gitwire-chat</h1>
      <button type="button" class="icon-btn" id="toggle-theme" title="색 테마">◐</button>
      <button type="button" class="icon-btn" id="toggle-add" title="방 추가">＋</button>
    </div>

    <!-- 색 테마. 값은 이 기기에만 남는다(localStorage) — 루프백 전용 개인 앱이라
         서버로 올릴 이득이 없다. 목록은 style.css 의 팔레트와 짝이며 그 일치는
         tests/test_theme.py 가 확인한다. -->
    <div class="theme-bar" id="theme-bar" hidden>
      <label class="field" for="theme-select">
        <span>색 테마</span>
        <select id="theme-select">
          <option value="default">기본</option>
          <option value="log">log</option>
          <option value="ide">ide</option>
          <option value="tty">tty</option>
          <option value="tui">tui</option>
        </select>
      </label>
      <p class="theme-note" id="theme-note"></p>

      <!-- 배치는 **다른 축**이다 (색과 조합해서 쓴다). 전환은 새로고침으로 간다 —
           그래야 가상 스크롤의 높이 캐시·전환 중 노드 재생성·스크롤 복원이라는
           세 위험이 존재조차 하지 않는다. 읽던 자리는 앵커 메시지로 복원한다. -->
      <label class="field" for="layout-select">
        <span>배치</span>
        <select id="layout-select">
          <option value="bubbles">말풍선</option>
          <option value="log">log</option>
          <option value="ide">ide</option>
        </select>
      </label>
      <p class="theme-note" id="layout-note"></p>
    </div>

    <form class="add-room" id="add-room" hidden>
      <label class="field">
        <span>레포 주소</span>
        <input type="text" id="repo-url" name="repo_url" required
               placeholder="https://github.com/me/our-room.git" autocomplete="off">
      </label>
      <label class="field">
        <span>방 이름 (선택)</span>
        <input type="text" id="room-name" name="name" placeholder="우리 방" autocomplete="off">
      </label>
      <label class="field">
        <span>토큰 환경변수 (선택)</span>
        <input type="text" id="token-env" name="token_env" placeholder="GITWIRE_TOKEN" autocomplete="off">
      </label>
      <p class="hint">빈 레포를 넣으면 gitwire 가 방 규약을 심는다. 토큰 <b>값</b>은 저장하지 않는다 — 환경변수 이름만 기억한다.</p>
      <div class="row">
        <button type="submit" class="primary" id="add-room-submit">방 등록</button>
        <button type="button" id="add-room-cancel">취소</button>
      </div>
      <p class="error" id="add-room-error" hidden></p>

      <!-- 레포가 아직 없는 사람을 위한 거들기. 만든 주소는 위 칸에 자동으로 들어간다
           (사용자가 URL 을 손으로 옮겨 적지 않게 하는 것이 이 블록의 존재 이유다). -->
      <div class="new-repo">
        <button type="button" class="link" id="new-repo-toggle">레포가 아직 없다 — 만들기 거들기</button>
        <div class="new-repo-form" id="new-repo-form" hidden>
          <label class="field">
            <span>소유자 (사용자명 또는 조직)</span>
            <input type="text" id="new-repo-owner" placeholder="비우면 토큰 주인" autocomplete="off">
          </label>
          <label class="field">
            <span>레포 이름</span>
            <input type="text" id="new-repo-name" placeholder="our-room" autocomplete="off">
          </label>
          <div class="row">
            <button type="button" id="new-repo-check">무엇이 만들어지나 보기</button>
          </div>
          <p class="hint" id="new-repo-plan" hidden></p>
          <div class="row">
            <a class="button" id="new-repo-link" target="_blank" rel="noopener noreferrer" hidden>GitHub 에서 만들기</a>
            <button type="button" class="primary" id="new-repo-create" hidden>지금 만들기</button>
            <button type="button" id="new-repo-use" hidden>만들었다 · 이 주소로 방 만들기</button>
          </div>
          <p class="error" id="new-repo-error" hidden></p>
        </div>
      </div>
    </form>

    <ul class="rooms" id="rooms"></ul>
    <p class="empty" id="rooms-empty">등록된 방이 없다. ＋ 로 레포 주소를 넣어라.</p>

    <!-- 갱신 알림 (static/js/update.js). ⭐ 여기서 앱을 갱신하지 **않는다** —
         「갱신한다」는 서버가 정본 CLI(`python -m gitwire_chat update`)를 분리된
         프로세스로 띄우게 하는 방아쇠일 뿐이다. 앱이 아예 안 뜨는 상태에서도
         복구가 되어야 하므로 CLI 가 정본이고, 그래서 칠 명령과 복사 버튼이
         그대로 남아 있다.
         흐름: 확인 → 무엇이 바뀌나 보여주고 확인받기 → 시작 → **서버를 잃는
         구간을 버티고** 새 버전으로 돌아오기 (그 구간의 소유자가 update.js 다).
         확인은 **누를 때만** 나간다 — 주기적으로 원격을 보지 않는다. 실행 요청은
         커스텀 헤더를 붙여 보내고 서버가 그것을 본다 (드라이브바이 방지 —
         근거는 update.js · gitwire_chat/csrf.py 도크). -->
    <div class="update-bar" id="update-bar">
      <button type="button" class="link" id="check-update">업데이트 확인</button>
      <p class="update-note" id="update-note" hidden></p>
      <a class="link" id="update-compare" target="_blank" rel="noopener noreferrer" hidden>무엇이 바뀌었나</a>
      <div class="update-actions">
        <button type="button" class="primary" id="run-update" hidden>지금 갱신</button>
        <button type="button" class="primary" id="confirm-update" hidden>갱신한다</button>
        <button type="button" id="cancel-update" hidden>취소</button>
      </div>
      <code class="update-cmd" id="update-cmd" hidden></code>
      <button type="button" class="link" id="copy-update-cmd" hidden>명령 복사</button>
    </div>
  </aside>

  <main class="chat" id="chat">
    <header class="chat-head">
      <button type="button" class="icon-btn back" id="back" title="방 목록">‹</button>
      <div class="titles">
        <h2 id="room-title">방을 고르자</h2>
        <p class="sub" id="room-sub"></p>
      </div>
      <button type="button" class="icon-btn" id="refresh" title="지금 당겨오기">↻</button>
      <button type="button" class="icon-btn" id="toggle-search" title="검색">⌕</button>
    </header>

    <form class="search-bar" id="search-bar" hidden>
      <input type="search" id="search-q" placeholder="과거 대화까지 서버에서 찾는다" autocomplete="off">
      <button type="submit" class="primary">검색</button>
      <button type="button" id="search-close">닫기</button>
    </form>

    <section class="search-results" id="search-results" hidden>
      <div class="search-head"><span id="search-summary"></span></div>
      <div id="search-list"></div>
    </section>

    <div class="timeline" id="timeline">
      <!-- 위로 스크롤하면 이 표식이 보이고, 그때 과거가 자동으로 이어 붙는다.
           페이지 버튼이 아니다 — 카톡에서 "2페이지"를 누르지 않는 것과 같다. -->
      <div class="older-sentinel" id="older-sentinel" aria-live="polite">
        <span id="older-note">이전 대화를 불러오는 중…</span>
      </div>

      <!-- ⭐ 떠 있는 발신자 머리 (배치 `ide` 의 연속 발화 묶기용).
           묶기는 같은 사람이 이어 말할 때 이름을 한 번만 찍는데, 창이 묶음
           **중간**에서 시작하면 그 이름이 화면 밖이라 누가 말했는지 알 수 없다.
           그래서 화면 위에 걸린 말의 발신자를 여기에 띄운다 (타임라인이 채운다).

           ⚠️ 높이 0 의 sticky 상자 + 절대 위치 줄이다 — **흐름을 차지하지 않는다.**
           차지하면 가상화가 계산한 세로 좌표와 실제 픽셀이 어긋나, 머리 잘림을
           막으려고 붙인 장치가 스크롤을 망가뜨린다.
           스크린 리더에는 감춘다 — 아래 진짜 머리를 이미 읽는다(중복). -->
      <div class="sticky-head" id="sticky-head" hidden aria-hidden="true">
        <div class="sticky-row">
          <span class="author" id="sticky-author"></span>
          <time class="ts" id="sticky-ts"></time>
        </div>
      </div>

      <div class="messages" id="messages" role="log" aria-live="polite"></div>
    </div>

    <button type="button" class="jump" id="jump-latest" hidden>새 메시지 ↓</button>

    <!-- 방이 아직 안 붙었거나 실패했을 때 그 자리에 남는 안내 (방은 사라지지 않는다) -->
    <div class="room-trouble" id="room-trouble" hidden>
      <p id="room-trouble-text"></p>
      <p class="hint" id="room-trouble-hint"></p>
      <button type="button" id="room-retry">재시도</button>
    </div>

    <!-- 아직 내 기기를 떠나지 못한 말이 있을 때만 뜬다 (static/js/outbox.js).
         말풍선의 '보내지 못했다'와 **다른 사고**라 자리도 문구도 따로 둔다. -->
    <div class="outbox" id="outbox" hidden>
      <span id="outbox-text"></span>
      <button type="button" class="link" id="outbox-retry">다시 보내기</button>
    </div>

    <form class="composer" id="composer">
      <input type="text" class="author" id="author" placeholder="표시 이름" autocomplete="off">
      <div class="reply-chip" id="reply-chip" hidden>
        <span id="reply-label"></span>
        <button type="button" id="reply-cancel" title="답장 취소">×</button>
      </div>
      <textarea id="text" rows="1" placeholder="메시지 (Enter 전송 · Shift+Enter 줄바꿈)"></textarea>
      <button type="submit" class="primary" id="send">보내기</button>
    </form>

    <p class="status" id="status"></p>
  </main>
</div>

<!-- 진입점 하나. ES 모듈이라 의존이 import 로 명시되고, 로딩 순서 문제가
     정의상 사라진다 (예전에는 인라인 모듈이 window 에 엔진을 담아 두고 classic
     스크립트가 그것을 집어갔다 — "실렸나 / 그때 실렸나"가 실제 사고 지점이었다).
     가상 스크롤 엔진(@tanstack/virtual-core)은 레포에 **벤더링**되어 있다.
     CDN 을 쓰지 않는 이유: 이 앱은 내 컴퓨터에서 도는 로컬 앱이고, 오프라인에서도
     떠야 하며, 외부 호스트에 의존을 만들지 않는다. 빌드 단계도 없다.

     ⭐ 이 태그의 URL 에 박힌 도장은 **모듈 그래프 전체**에 전파된다. 상대 import
     (`./js/boot.js`)가 같은 접두사 안에서 해석되기 때문이다 —
     `/assets/<도장>/app.js` → `/assets/<도장>/js/boot.js`. 벤더 파일도 같다.
     그래서 옛 파일 하나가 새 파일들 사이에 섞이는 일이 생길 수 없다. -->
<script type="module" src="{{ asset('app.js') }}"></script>
</body>
</html>
