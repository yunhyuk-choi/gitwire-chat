[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gitwire-chat"
version = "0.2.0"
description = "중앙 서버 없이 git 레포를 메시지 저장소로 쓰는 로컬-퍼스트 비동기 채팅"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    # 전송 계층. PyPI 에 없으므로 **공개 레포를 직접** 가리킨다 — 이 한 줄이
    # "레포만 클론하면 설치된다"를 성립시킨다. 예전처럼 `gitwire` 라고만 적으면
    # 옆 디렉토리에 체크아웃을 나란히 둔 사람만 설치할 수 있다.
    # 개발 중 로컬 체크아웃을 쓰는 방법은 README "개발" 참조.
    "gitwire @ git+https://github.com/yunhyuk-choi/gitwire.git",
    "flask>=3",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
gitwire-chat = "gitwire_chat.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# ⚠️ `static/*` 는 한 겹만 잡는다. 프런트엔드 모듈은 static/js/ 아래, 가상 스크롤
# 엔진은 static/vendor/... 아래에 있으므로 하위 디렉토리까지 명시해야 한다 —
# 빠지면 pip 로 설치했을 때만 화면이 안 그려지는(소스 체크아웃에서는 멀쩡한)
# 조용한 실패가 된다. `tests/test_frontend.py` 가 이 목록의 빠짐을 잡는다.
gitwire_chat = ["templates/*.html", "static/*", "static/js/*", "static/vendor/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `-ra` = 건너뛴 테스트의 **사유를 매 실행 요약에 찍는다.** 브라우저 연기 테스트는
# 브라우저가 없는 환경에서 SKIP 되는데, 그것이 조용히 지나가면 "돌았다고 착각한
# 검증"이 된다 — 이번 사고가 바로 그 계열이다.
addopts = "-p no:cacheprovider -ra"
