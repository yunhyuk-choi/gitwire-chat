[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gitwire-chat"
version = "0.1.0"
description = "중앙 서버 없이 git 레포를 메시지 저장소로 쓰는 로컬-퍼스트 비동기 채팅"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gitwire",
    "flask>=3",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
gitwire-chat = "gitwire_chat.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gitwire_chat = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
